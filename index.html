<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#143b57"><link rel="manifest" href="manifest.webmanifest"><title>Coletor DM + EVS</title><style>body{font-family:Arial,sans-serif;background:#edf2f6;color:#173249;margin:0}header{background:#143b57;color:white;padding:20px}main{max-width:600px;margin:auto;padding:15px}.card{background:white;border-radius:12px;padding:16px;margin:12px 0}input,select,button{box-sizing:border-box;width:100%;font:inherit;padding:12px;margin:5px 0 12px;border-radius:8px;border:1px solid #c5d3dc}button{background:#176b9d;color:white;border:0;font-weight:bold}button.alt{background:#e1eaf0;color:#143b57}label{font-weight:bold;display:block}small{color:#526879}.entry{padding:10px 0;border-top:1px solid #ddd}img{max-width:100%}h2{font-size:19px}</style></head><body><header><h2>Coletor DM + EVS</h2>Baixas de inspeção por TAG</header><main><section class="card"><label>Inspetor</label><select id="insp"><option value="">Selecione</option><option>Sandro</option><option>Thiago</option><option>Rodrigo</option><option>Pedro</option></select><label>Obra / Subobra</label><input id="obra" placeholder="S179 / 40825-04-SF"></section><section class="card"><h2>Nova baixa</h2><label>TAG</label><input id="tag" placeholder="Marca principal do desenho"><label>Fotografar desenho</label><input id="foto" type="file" accept="image/*" capture="environment"><button id="ler">Reconhecer TAG por OCR</button><div id="status"></div><div id="opcoes"></div><label>Quantidade DM + EVS</label><input id="qtd" type="number" min="1" step="1" value="1"><div id="solda"><label>Sinete soldador</label><input id="sinete" placeholder="S44 ou S53/S19"></div><button id="salvar">Salvar baixa</button><button class="alt" id="desfazer">Desfazer última baixa</button></section><section class="card"><h2>Lista consolidada</h2><div id="lista"></div><button id="csv">Exportar CSV para Excel</button><button class="alt" id="historico">Mostrar histórico</button><div id="eventos"></div></section><small>Dados locais neste navegador. Exporte uma cópia regularmente. OCR necessita internet para carregar a biblioteca e pode precisar novamente em outras sessões.</small></main><script src="app.js"></script></body></html>
